services:
  flowise:
    image: flowiseai/flowise:latest
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      FLOWISE_USERNAME: ${FLOWISE_USERNAME:-}
      FLOWISE_PASSWORD: ${FLOWISE_PASSWORD:-}
    volumes:
      - flowise_data:/root/.flowise
    depends_on:
      mcp-research-server:
        condition: service_healthy
    restart: unless-stopped

  mcp-research-server:
    build: .
    image: flowise-mcp-research-server:runtime
    ports:
      - "8000:8000"
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      MCP_PATH: /mcp
      RESEARCH_SESSION_DB: /app/data/research_sessions.sqlite3
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      GOOGLE_CSE_API_KEY: ${GOOGLE_CSE_API_KEY:-}
      GOOGLE_CSE_ID: ${GOOGLE_CSE_ID:-}
      PUBMED_API_KEY: ${PUBMED_API_KEY:-}
      ALPHAXIV_API_KEY: ${ALPHAXIV_API_KEY:-}
      JINA_API_KEY: ${JINA_API_KEY:-}
      UNPAYWALL_EMAIL: ${UNPAYWALL_EMAIL:-}
    volumes:
      - mcp_research_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  flowise_data:
  mcp_research_data:
